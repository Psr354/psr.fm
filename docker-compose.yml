services:
  psr_fm:
    build: .
    container_name: psr_fm_app
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./templates:/app/templates
      - ./logs:/app/logs
      - ./app.py:/app/app.py
      - ./routes:/app/routes
      - ./services:/app/services
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PSR_FM_DATABASE_PATH=/app/data/psr_fm.sqlite3
      - PSR_FM_DOWNLOAD_DIR=/app/data/downloads
      - PSR_FM_ALBUM_ART_DIR=/app/data/album_art
