<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>psr.fm - Offline</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta name="theme-color" content="#1db954">
    <style>
        :root {
            --bg-main: #090909;
            --bg-panel: #101310;
            --text-primary: #f5f7f5;
            --text-secondary: #9aa39d;
            --accent-color: #30d66b;
            --border-subtle: rgba(223, 255, 232, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 0%, rgba(48, 214, 107, 0.14), transparent 34%),
                linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                var(--bg-main);
            background-size: auto, 44px 44px, 44px 44px, auto;
            color: var(--text-primary);
            font-family: Manrope, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 460px);
            padding: 34px;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            background: rgba(16, 19, 16, 0.96);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5), inset 0 1px rgba(255, 255, 255, 0.04);
        }

        .mark {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            margin-bottom: 22px;
            border-radius: 18px;
            background: var(--accent-color);
            color: #061207;
        }

        .mark svg {
            width: 34px;
            height: 34px;
            fill: currentColor;
        }

        h1 {
            font-size: 32px;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.65;
            font-size: 15px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 26px;
        }

        a,
        button {
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            background: transparent;
            font: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }

        .primary {
            border-color: transparent;
            background: var(--accent-color);
            color: #061207;
        }

        @media (max-width: 480px) {
            main {
                padding: 28px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M12 3v10.7a3.9 3.9 0 1 0 2 3.4V7h4V3h-6z"></path>
            </svg>
        </div>
        <h1>psr.fm sedang offline</h1>
        <p>
            Koneksi ke server belum tersedia. Kalau playlist sudah disimpan offline di perangkat ini,
            buka kembali app dari ikon PWA atau coba muat ulang setelah koneksi kembali.
        </p>
        <div class="actions">
            <button class="primary" type="button" onclick="window.location.reload()">Coba Lagi</button>
            <a href="/">Buka App</a>
        </div>
    </main>
    <script src="/static/offline-register.js"></script>
</body>
</html>
